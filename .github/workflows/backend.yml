name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'Backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: ./Backend

      - name: Build
        run: dotnet build --no-restore
        working-directory: ./Backend